      x-feature-condition: passwordResetAllowed
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: ref
          in: query
          required: true
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the storefront page
        default:
          description: HTML error page
  /auth/applications/{applicationId}/headless/v1/transactions/{transaction}/email-verification/resend:
    post:
      tags:
        - Headless authentication
      operationId: resendApplicationUserHeadlessVerificationEmail
      summary: Email the verification link again
      description: |
        Answers `verification_sent` alike for an unknown, unverified and verified
        email, also when the email cannot be delivered. The link opens
        `verify_uri`, or the hosted page without it.
      x-feature-condition: emailVerificationEnabled
      security:
        - oauthClientBasic: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/HeadlessTransaction'
        - $ref: '#/components/parameters/HeadlessEndUserIp'
        - $ref: '#/components/parameters/HeadlessEndUserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeadlessEmailVerificationResendRequest'
      responses:
        '200':
          $ref: '#/components/responses/HeadlessStepResult'
        '400':
          $ref: '#/components/responses/HeadlessError'
        '401':
          $ref: '#/components/responses/HeadlessError'
        '403':
          $ref: '#/components/responses/HeadlessError'
        '404':
          $ref: '#/components/responses/HeadlessError'
        '429':
          $ref: '#/components/responses/HeadlessError'
        '503':
          $ref: '#/components/responses/HeadlessError'
  /auth/applications/{applicationId}/headless/v1/email-verification/link:
    get:
      tags:
        - Headless authentication
      operationId: openApplicationUserHeadlessEmailVerificationLink
      summary: Browser navigation from an email verification email
      description: |
        The verification email leads here with the token. Verifies the email and
        redirects the browser to the storefront `verify_uri` with
        `email_verified=true`, or with `error=invalid_token` for an invalid,
        expired, missing or spent verification token (an email verified before
        counts as spent). The signed `ref` outlives the verification token.
      x-feature-condition: emailVerificationEnabled
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: ref
          in: query
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the storefront page
        default:
          description: HTML error page
  /auth/applications/{applicationId}/headless/v1/account/connections:
    get:
      tags:
        - Headless authentication
      operationId: listApplicationUserHeadlessAccountConnections
      summary: Social account connections of the signed-in user
      security:
        - oauthClientBasic: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/HeadlessEndUserAccessToken'
        - $ref: '#/components/parameters/HeadlessEndUserIp'
        - $ref: '#/components/parameters/HeadlessEndUserAgent'
      responses:
        '200':
          description: Connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeadlessAccountConnections'
        '401':
          $ref: '#/components/responses/HeadlessError'
        '503':
          $ref: '#/components/responses/HeadlessError'
  /auth/applications/{applicationId}/headless/v1/account/connections/link:
    post:
      tags:
        - Headless authentication
      operationId: linkApplicationUserHeadlessAccountConnection
      summary: Start linking a social provider to the signed-in user
      description: |
        Answers a one-time launch URL valid for 60 seconds. After the provider
        the browser returns to `return_uri` with `connection=linked` or
        `connection_error`. Requires a session younger than 10 minutes.
      x-feature-condition: socialProviders
      security:
        - oauthClientBasic: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/HeadlessEndUserAccessToken'
        - $ref: '#/components/parameters/HeadlessEndUserIp'
        - $ref: '#/components/parameters/HeadlessEndUserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeadlessAccountLinkRequest'
      responses:
        '200':
          $ref: '#/components/responses/HeadlessStepResult'
        '400':
          $ref: '#/components/responses/HeadlessError'
        '401':
          $ref: '#/components/responses/HeadlessError'
        '403':
          $ref: '#/components/responses/HeadlessError'
        '404':
          $ref: '#/components/responses/HeadlessError'
        '429':
          $ref: '#/components/responses/HeadlessError'
        '503':
          $ref: '#/components/responses/HeadlessError'
  /auth/applications/{applicationId}/headless/v1/account/connections/unlink:
    post:
      tags:
        - Headless authentication
      operationId: unlinkApplicationUserHeadlessAccountConnection
      summary: Remove the single connection of a provider
      description: |
        The last way to sign in cannot be removed (`last_login_method`); a
        provider connected twice answers `account_conflict`. Requires a session
        younger than 10 minutes.
      security:
        - oauthClientBasic: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/HeadlessEndUserAccessToken'
        - $ref: '#/components/parameters/HeadlessEndUserIp'
        - $ref: '#/components/parameters/HeadlessEndUserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeadlessAccountUnlinkRequest'
      responses:
        '200':
          description: Connection removed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - unlinked
        '400':
          $ref: '#/components/responses/HeadlessError'
        '401':
          $ref: '#/components/responses/HeadlessError'
        '403':
          $ref: '#/components/responses/HeadlessError'
        '404':
          $ref: '#/components/responses/HeadlessError'
        '409':
          $ref: '#/components/responses/HeadlessError'
        '503':
          $ref: '#/components/responses/HeadlessError'
  /auth/applications/{applicationId}/headless/v1/account/connections/launch:
    get:
      tags:
        - Headless authentication
      operationId: launchApplicationUserHeadlessAccountConnection
      summary: Browser navigation that starts the provider redirect of an account link
      description: Consumes the one-time ticket from `link`; a second navigation is rejected.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: ticket
          in: query
          required: true
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the provider, or to `return_uri` with `connection_error`
        default:
          description: HTML error page
  /auth/applications/{applicationId}/headless/v1/account/connections/return:
    get:
      tags:
        - Headless authentication
      operationId: returnApplicationUserHeadlessAccountConnection
      summary: Provider callback of an account link
      description: |
        Redirects the browser to `return_uri` with `connection=linked` only when
        the provider account is stored for the user, otherwise with
        `connection_error`. An unreadable provider state also returns here.
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: ref
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the storefront page
        default:
          description: HTML error page
  /auth/applications/{applicationId}/headless/v1/logout:
    post:
      tags:
        - Headless authentication
      operationId: logoutApplicationUserHeadless
      summary: Revoke the end-user session issued to this client
      description: Idempotent; always returns `logged_out` for an authenticated client.
      security:
        - oauthClientBasic: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/HeadlessEndUserIp'
        - $ref: '#/components/parameters/HeadlessEndUserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeadlessLogoutRequest'
      responses:
        '200':
          description: Session revoked or already absent
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - logged_out
        '400':
          $ref: '#/components/responses/HeadlessError'
        '401':
          $ref: '#/components/responses/HeadlessError'
