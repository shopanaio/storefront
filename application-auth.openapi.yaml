security:
  - apiKeyCookie: []
servers:
  - url: https://iam.example.com
    description: Replace with IAM_PUBLIC_BASE_URL
tags:
  - name: Discovery
  - name: OAuth
  - name: Password authentication
  - name: Email OTP
  - name: Social authentication
  - name: Sessions
  - name: Headless authentication
paths:
  /auth/applications/{applicationId}/verify-email:
    get:
      tags:
        - Password authentication
      description: Verify the email of the user
      operationId: verifyApplicationUserEmail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: token
          in: query
          required: true
          schema:
            type: string
        - name: callbackURL
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    $ref: '#/components/schemas/ApplicationUser'
                  status:
                    type: boolean
                    description: Indicates if the email was verified successfully
                required:
                  - status
                  - user
        '302':
          description: Redirect to callbackURL when it was supplied
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
          description: Bad Request. Usually due to missing parameters, or invalid parameters.
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
          description: Unauthorized. Due to missing or invalid authentication.
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Forbidden. You do not have permission to access this resource or to perform this action.
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Not Found. The requested resource was not found.
        '429':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Too Many Requests. You have exceeded the rate limit. Try again later.
        '500':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Internal Server Error. This is a problem with the server that you cannot fix.
        default:
          $ref: '#/components/responses/ApplicationAuthError'
      summary: Verify an application user's email
      x-feature-condition: emailVerificationEnabled
  /auth/applications/{applicationId}/reset-password/{token}:
    get:
      tags:
        - Default
      description: Redirects the user to the callback URL with the token
      operationId: resetPasswordCallback
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: token
          in: path
          required: true
          description: The token to reset the password
          schema:
            type: string
        - name: callbackURL
          in: query
          required: true
          description: The URL to redirect the user to reset their password
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
