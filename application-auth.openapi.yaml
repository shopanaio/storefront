openapi: 3.0.3
info:
  title: Shopana IAM Application Authentication API
  version: 1.0.0
  description: |
    Machine-readable contract for application-scoped OAuth 2.1, OpenID Connect,
    application-user authentication, and session management.

    Every realm is isolated by `applicationId`. Availability of password,
    email verification, email OTP, and social-provider operations depends on
    that application's effective authentication policy. Unknown and disabled
    operations intentionally return `404`.

    OAuth authorization-code flows require PKCE S256 and exactly one `resource`
    equal to the immutable resource configured for the application. The same
    resource must be sent when exchanging and refreshing tokens.
  contact:
    name: Shopana IAM
  x-runtime-versions:
    better-auth: 1.6.23
    better-auth-oauth-provider: 1.6.23
