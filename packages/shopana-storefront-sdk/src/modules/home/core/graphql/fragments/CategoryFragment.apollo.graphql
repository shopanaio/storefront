fragment SdkCategoryFragment_category on Category {
  __typename
  id
  title: name
  handle
  listing: products(first: 12) {
    edges {
      node {
        id
        title
        handle
        featuredMedia {
          ... on MediaImage {
            id
            image {
              url
            }
          }
        }
        selectedOrFirstAvailableVariant {
          id
          title
          handle
          price {
            amount
            currencyCode
          }
          compareAtPrice {
            amount
            currencyCode
          }
        }
      }
    }
  }
}
