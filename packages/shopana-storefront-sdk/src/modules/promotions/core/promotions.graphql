fragment SdkStorefrontPromotion on StorefrontPromotion {
  key
  kind
  presentation {
    headline
    badge
    shortBadge
    description {
      text
      html
    }
    accessibilityLabel
    terms
  }
  value {
    type
    percentage
    amount {
      amount
      currencyCode
    }
    maximumDiscount {
      amount
      currencyCode
    }
    maximumShippingPrice {
      amount
      currencyCode
    }
    buyQuantity
    getQuantity
  }
  minimumSubtotal {
    amount
    currencyCode
  }
  minimumQuantity
  appliesOnOneTimePurchase
  appliesOnSubscription
  startsAt
  endsAt
  placements
  benefitScope
}

# The items the merchant chose for the benefit of a buy X get Y promotion: the cards of its
# variants, each showing its gift variant, or of its products, with the variant the listing picked.
fragment SdkPromotionBenefitItems on StorefrontPromotion {
  benefitVariantCards {
    ...SdkProductCard
  }
  benefitProductCards {
    ...SdkProductCard
  }
}

query SdkStorefrontPromotions($kinds: [StorefrontPromotionKind!]) {
  storefrontPromotions(kinds: $kinds) {
    promotions {
      ...SdkStorefrontPromotion
    }
    validUntil
    revision
  }
}

# The products a buy X get Y promotion lowers, each with the price of one unit as its benefit.
query SdkPromotionBenefitProducts($promotionKey: ID!, $first: Int!) {
  products(
    first: $first
    filters: [{ promotionId: $promotionKey, promotionRole: BENEFIT }]
  ) {
    nodes {
      ...SdkProductCard
      variant {
        id
        benefitPrice(promotionKey: $promotionKey) {
          amount
          currencyCode
        }
      }
    }
  }
}
