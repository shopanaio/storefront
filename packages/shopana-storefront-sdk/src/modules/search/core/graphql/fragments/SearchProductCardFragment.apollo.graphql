fragment SdkSearchProductCardFragment on Product {
  __typename
  id
  title
  handle
  description {
    text
    html
  }
  rating: reviewSummary {
    rating: averageRating
    count: reviewCount
  }
  cover: featuredMedia {
    ... on MediaImage {
      id
      image {
        url
      }
    }
  }
  gallery: media(first: 20) {
    edges {
      node {
        id
        ... on MediaImage {
          image {
            url
          }
        }
      }
    }
  }
  options {
    id
    handle
    title: name
    displayType
    values: optionValues {
      id
      title: name
      handle
      swatch {
        color
        color2: secondaryColor
        image {
          id
          ... on MediaImage {
            image {
              url
            }
          }
        }
        displayType: type
      }
    }
  }
  selectedVariant: selectedOrFirstAvailableVariant {
    id
    title
    handle
    sku
    price {
      amount
      currencyCode
    }
    compareAtPrice {
      amount
      currencyCode
    }
    isAvailable: availableForSale
    selectedOptions {
      name
      value
      option {
        id
        handle
        name
      }
      optionValue {
        id
        handle
        name
      }
    }
  }
}
