fragment SdkSearchProductsFragment on ProductConnection {
  __typename
  totalCount
  sort
  availableSorts
  filters {
    id
    handle: id
    label
    title: label
    type
    priceRange {
      min {
        amount
        currencyCode
      }
      max {
        amount
        currencyCode
      }
      selectedMin {
        amount
        currencyCode
      }
      selectedMax {
        amount
        currencyCode
      }
    }
    values {
      id
      handle: id
      label
      title: label
      count
      selected
      input
    }
  }
  pageInfo {
    hasNextPage
    endCursor
  }
  edges {
    cursor
    node {
      ...SdkSearchProductCardFragment
    }
  }
}
