query SdkCollectionQuery(
  $handle: String!
  $first: Int = 24
  $after: Cursor
  $sort: ListingSort = MANUAL
  $filters: [ListingFilterInput!] = []
) {
  category: categoryByHandle(handle: $handle) {
    id
    title: name
    handle
    description {
      text
      html
      json
    }
    ...SdkCollectionListingFragment
  }
}
