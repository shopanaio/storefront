fragment SdkCollectionListingFragment on Category {
  __typename
  id
  title: name
  handle
  listing: products(
    first: $first
    after: $after
    sort: $sort
    filters: $filters
  ) {
    totalCount
    sort
    availableSorts
    filters {
      id
      handle: id
      label
      title: label
      type
      presentation
      selectionMode
      priceRange {
        min {
          amount
          currencyCode
        }
        max {
          amount
          currencyCode
        }
        selectedMin {
          amount
          currencyCode
        }
        selectedMax {
          amount
          currencyCode
        }
      }
      values {
        id
        handle: id
        label
        title: label
        count
        selected
        input
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        ...SdkCollectionProductCardFragment
      }
    }
  }
}
