# Standalone public cache fragment; it is consumed from TypeScript rather than spread by an operation.
# eslint-disable-next-line @graphql-eslint/no-unused-fragments
fragment SdkProductReviewsFragment on Product {
  __typename
  id
  reviews(first: $first, after: $after, sort: $sort) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        id
        kind
        rating
        title
        message: body
        locale
        author {
          type
          displayName
        }
        status
        revision
        verifiedPurchase: isVerifiedPurchase
        verificationStatus
        metrics {
          helpfulYes: likeCount
          helpfulNo: dislikeCount
          mediaCount
        }
        viewerEngagement {
          meHelpful: vote
          hasReported
        }
        createdAt
        editedAt: updatedAt
        publishedAt
        media {
          id
          media {
            id
            ... on MediaImage {
              image {
                url
              }
            }
          }
        }
      }
    }
  }
}
