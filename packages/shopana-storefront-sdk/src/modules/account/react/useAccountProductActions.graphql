query SdkAccountProductActionsQuery {
  customer {
    id
    defaultWishlist {
      id
      items(first: 100) {
        nodes {
          id
          product {
            id
          }
        }
      }
    }
    productComparisons {
      nodes {
        columns(first: 100) {
          nodes {
            variant {
              id
            }
          }
        }
      }
    }
  }
}
