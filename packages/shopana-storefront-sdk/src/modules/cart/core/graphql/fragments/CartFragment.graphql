  issues {
    code
    message
    severity
    effect
    field
    lineId
    retryable
  }
  createdAt
  updatedAt
  totalQuantity
  cost {
    subtotalAmount {
      currencyCode
      amount
    }
    totalDiscountAmount {
      currencyCode
      amount
    }
    totalTaxAmount {
      currencyCode
      amount
    }
    totalAmount {
      currencyCode
      amount
