fragment SdkCartPromotionRequirement on CheckoutPromotionRequirement {
  type
  required {
    amount
    currencyCode
  }
  current {
    amount
    currencyCode
  }
  remaining {
    amount
    currencyCode
  }
  requiredQuantity
  currentQuantity
  remainingQuantity
  ratio
}

