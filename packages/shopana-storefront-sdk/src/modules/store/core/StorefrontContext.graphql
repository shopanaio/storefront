fragment SdkStoreImage on MediaImage {
  id
  alt
  image {
    id
    url
    width
    height
    altText
    thumbhash
  }
}

fragment SdkStore on Store {
  id
  handle
  name
  description
  email
  timezone
  defaultLocale
  locales
  defaultCurrency
  contact {
    name
    email
    phoneNumbers
  }
  address {
    companyName
    countryCode
    address1
    address2
    city
    province
    postalCode
  }
  brand {
    logo {
      ...SdkStoreImage
    }
    squareLogo {
      ...SdkStoreImage
    }
    coverImage {
      ...SdkStoreImage
    }
    primaryColor
    secondaryColor
    slogan
    shortDescription
    socialLinks {
      platform
      url
    }
  }
  policies {
    id
    type
    handle
    path
    title
  }
}

query SdkStorefrontContext {
  store {
    ...SdkStore
  }
}

query SdkStorefrontLocales {
  store {
    id
    defaultLocale
    locales
  }
}
