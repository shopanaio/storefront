query StorefrontLoyaltyAccountQuery {
  customer {
    id
    loyaltyAccount {
      id
      status
      balance {
        availablePoints
        pendingPoints
      }
      tier {
        code
        name
        earnMultiplierBps
        progress {
          nextTier {
            name
          }
          presentation {
            headline
          }
        }
      }
      upcomingExpirations {
        points
        expiresAt
      }
      storeCredit {
        availableAmount {
          ...StorefrontCheckoutMoney
        }
        pendingAmount {
          ...StorefrontCheckoutMoney
        }
        upcomingExpirations {
          amount {
            ...StorefrontCheckoutMoney
          }
          expiresAt
        }
      }
      redemptionSources {
        source
        availablePoints
        availableAmount {
          ...StorefrontCheckoutMoney
        }
        minimum {
          points
          amount {
            ...StorefrontCheckoutMoney
          }
        }
        maximumPerOrder {
          points
          amount {
            ...StorefrontCheckoutMoney
          }
        }
      }
      availableRewards(first: 20) {
        nodes {
          id
          discountCode
          validUntil
          presentation {
            headline
            description
          }
          reward {
            kind
            ... on LoyaltyVoucherRewardPresentation {
              code
            }
          }
        }
      }
    }
  }
}
