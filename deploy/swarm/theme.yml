version: '3.8'

services:
  theme:
    image: ${THEME_IMAGE:?Set THEME_IMAGE to a release tag or digest}
    command: ['node', '/run/configs/start.cjs']
    environment:
      # The static site (step A of plans/static-site-generation.ru.md): its R2 bucket over the
      # S3 API, read with the key of the server env secret, every page checked again after the
      # TTL (seconds). Empty: the static site of the image (build/static), when it has one.
      STOREFRONT_STATIC_STORE: ${STATIC_STORE:-}
      STOREFRONT_STATIC_S3_ENDPOINT: ${STATIC_ENDPOINT:-}
      STOREFRONT_STATIC_CACHE_TTL: '10'
      # Hits and misses of the static site go to the coordinator (its internal token is in the
      # server env secret); empty without one.
      STOREFRONT_STATIC_COORDINATOR_URL: ${STATIC_COORDINATOR_URL:-http://theme-static:3100}
    # backend: server GraphQL requests reach the gateway directly (STOREFRONT_SERVER_GRAPHQL_URL).
    networks: [frontend, backend]
    configs:
      - source: server_launcher
        target: /run/configs/start.cjs
    secrets:
      - source: server_env
        target: server-env
        uid: '1000'
        gid: '1000'
        mode: 0400
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 2
        constraints:
          - node.labels.shopana.runtime != monolith
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        reservations:
          cpus: '0.25'
          memory: 256M
        limits:
          cpus: '1.0'
          memory: 1G

  # The coordinator of the static site (plans/static-coordinator.ru.md): the event feed, the
  # index of pages, the queue, dispatches of static-site.yml, leases, purges. One replica on the
  # node of its volume: its SQLite database has one writer. It renders nothing.
  theme-static:
    image: ${THEME_IMAGE:?Set THEME_IMAGE to a release tag or digest}
    command: ['node', '/run/configs/start-static.cjs']
    environment:
      THEME_IMAGE: ${THEME_IMAGE}
      STATIC_DATA_DIR: /data
      STATIC_ENVIRONMENT: ${STATIC_ENVIRONMENT:?Set STATIC_ENVIRONMENT to the GitHub environment (stage, production)}
      STATIC_GITHUB_REPOSITORY: ${STATIC_GITHUB_REPOSITORY:-shopanaio/storefront-brand-bite-and-crunch}
      STATIC_GITHUB_APP_ID: ${STATIC_GITHUB_APP_ID:-}
      STATIC_GITHUB_INSTALLATION_ID: ${STATIC_GITHUB_INSTALLATION_ID:-}
      SHOPANA_ADMIN_GRAPHQL_URL: ${SHOPANA_ADMIN_GRAPHQL_URL:-}
      SHOPANA_STORE_NAME: ${SHOPANA_STORE_NAME:-}
      SHOPANA_EVENTS_TOKEN_URL: ${SHOPANA_EVENTS_TOKEN_URL:-}
      SHOPANA_EVENTS_CLIENT_ID: ${SHOPANA_EVENTS_CLIENT_ID:-}
      # Snapshots of the index go to the bucket of the site, under __builder/.
      STATIC_INDEX_STORE: ${STATIC_STORE:-}
      STOREFRONT_STATIC_S3_ENDPOINT: ${STATIC_ENDPOINT:-}
      # Step B: the zone whose CDN tags are purged (the token is in the static env secret).
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
    networks: [frontend, backend]
    volumes:
      - theme-static-data:/data
    configs:
      - source: static_launcher
        target: /run/configs/start-static.cjs
    secrets:
      - source: static_env
        target: static-env
        uid: '1000'
        gid: '1000'
        mode: 0400
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/__builder/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.shopana.static == true
      update_config:
        parallelism: 1
        # One writer of the database: the old task stops before the new one opens it.
        order: stop-first
        failure_action: rollback
        monitor: 60s
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        reservations:
          cpus: '0.1'
          memory: 128M
        limits:
          cpus: '0.5'
          memory: 512M

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Set CLOUDFLARED_IMAGE to a version tag or digest}
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:2000
      - run
      - --token-file
      - /run/secrets/tunnel-token
    networks: [frontend, backend]
    secrets:
      - source: tunnel
        target: tunnel-token
    healthcheck:
      test:
        ['CMD', 'cloudflared', 'tunnel', '--metrics', '127.0.0.1:2000', 'ready']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
      resources:
        reservations:
          cpus: '0.1'
          memory: 128M
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  frontend:
    driver: overlay
  backend:
    external: true
    name: ${BACKEND_NETWORK:?Set BACKEND_NETWORK to the internal edge overlay network}

volumes:
  theme-static-data:

configs:
  server_launcher:
    file: ../runtime/start.cjs
    name: ${LAUNCHER_CONFIG:?Set LAUNCHER_CONFIG}
  static_launcher:
    file: ../runtime/start-static.cjs
    name: ${STATIC_LAUNCHER_CONFIG:?Set STATIC_LAUNCHER_CONFIG}

secrets:
  tunnel:
    external: true
    name: ${TUNNEL_SECRET:?Set TUNNEL_SECRET}
  server_env:
    external: true
    name: ${SERVER_ENV_SECRET:?Set SERVER_ENV_SECRET}
  static_env:
    external: true
    name: ${STATIC_ENV_SECRET:?Set STATIC_ENV_SECRET}
