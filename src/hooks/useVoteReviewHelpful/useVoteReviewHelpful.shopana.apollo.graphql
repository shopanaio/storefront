mutation StorefrontUseVoteReviewHelpfulMutation(
  $input: ReviewContentVoteSetInput!
) {
  reviewContentVoteSet(input: $input) {
    content {
      id
      metrics {
        likeCount
        dislikeCount
      }
      viewerEngagement {
        vote
        hasReported
      }
    }
    vote {
      id
      type
    }
    errors: userErrors {
      code
      field
      message
    }
  }
}
