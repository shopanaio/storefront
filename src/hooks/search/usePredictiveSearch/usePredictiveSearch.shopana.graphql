query StorefrontUsePredictiveSearchQuery($query: String!) {
  predictiveSearch: searchProducts(query: $query, first: 8, sort: RELEVANCE) {
    products: nodes {
      id
      title
      handle
      cover: featuredMedia {
        ... on MediaImage {
          image {
            url
          }
        }
      }
      selectedVariant: selectedOrFirstAvailableVariant {
        id
        title
        handle
        price {
          amount
          currencyCode
        }
        compareAtPrice {
          amount
          currencyCode
        }
      }
    }
    totalCount
  }
}
