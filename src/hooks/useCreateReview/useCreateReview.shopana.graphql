mutation StorefrontUseCreateReviewMutation($input: ReviewCreateInput!) {
  reviewCreate(input: $input) {
    review {
      id
      rating
      title
      message: body
      locale
      status
      revision
      verifiedPurchase: isVerifiedPurchase
      verificationStatus
      author {
        type
        displayName
      }
      metrics {
        helpfulYes: likeCount
        helpfulNo: dislikeCount
        mediaCount
      }
      viewerEngagement {
        vote
        hasReported
      }
      createdAt
      updatedAt
      publishedAt
      media {
        id
        media {
          id
          ... on MediaImage {
            image {
              url
            }
          }
        }
      }
    }
    errors: userErrors {
      code
      field
      message
    }
  }
}
