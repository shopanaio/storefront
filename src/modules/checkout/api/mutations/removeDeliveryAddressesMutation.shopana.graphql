mutation StorefrontRemoveDeliveryAddressesMutation(
  $input: CheckoutDeliveryAddressesRemoveInput!
) {
  checkoutDeliveryAddressesRemove(input: $input) {
    checkout {
      ...StorefrontUseCheckoutFragment
    }
    errors: userErrors {
      code
      field
      message
      retryable
    }
  }
}
