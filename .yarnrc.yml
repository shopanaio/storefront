approvedGitRepositories:
  - '**'

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

packageExtensions:
  '@testing-library/jest-dom@*':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true

yarnPath: .yarn/releases/yarn-4.18.1.cjs
